<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e1b4b"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#a855f7"/>
      <stop offset="100%" stop-color="#f59e0b"/>
    </linearGradient>
    <radialGradient id="glow1" cx="20%" cy="25%" r="40%">
      <stop offset="0%" stop-color="#a855f7" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#a855f7" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glow2" cx="85%" cy="80%" r="35%">
      <stop offset="0%" stop-color="#f59e0b" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#f59e0b" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="1200" height="630" fill="url(#bg)"/>
  <rect width="1200" height="630" fill="url(#glow1)"/>
  <rect width="1200" height="630" fill="url(#glow2)"/>
  <!-- grid pattern -->
  <g stroke="#a855f7" stroke-opacity="0.06" stroke-width="1">
    <path d="M0 60 H1200 M0 120 H1200 M0 180 H1200 M0 240 H1200 M0 300 H1200 M0 360 H1200 M0 420 H1200 M0 480 H1200 M0 540 H1200 M0 600 H1200"/>
    <path d="M60 0 V630 M120 0 V630 M180 0 V630 M240 0 V630 M300 0 V630 M360 0 V630 M420 0 V630 M480 0 V630 M540 0 V630 M600 0 V630 M660 0 V630 M720 0 V630 M780 0 V630 M840 0 V630 M900 0 V630 M960 0 V630 M1020 0 V630 M1080 0 V630 M1140 0 V630"/>
  </g>
  <!-- badge -->
  <rect x="90" y="110" width="320" height="52" rx="26" fill="#1e293b" stroke="#a855f7" stroke-opacity="0.4"/>
  <circle cx="120" cy="136" r="6" fill="#f59e0b"/>
  <text x="140" y="143" font-family="Inter, system-ui, sans-serif" font-size="20" fill="#cbd5e1" font-weight="600">Only 8 spots per cohort</text>
  <!-- headline -->
  <text x="88" y="280" font-family="'Space Grotesk', Inter, sans-serif" font-size="84" font-weight="700" fill="#f8fafc">A residency for</text>
  <text x="88" y="380" font-family="'Space Grotesk', Inter, sans-serif" font-size="84" font-weight="700" fill="url(#accent)">founders who ship.</text>
  <!-- subhead -->
  <text x="92" y="450" font-family="Inter, system-ui, sans-serif" font-size="30" fill="#cbd5e1">Startup residency for founders, developers &amp; builders in Gurgaon</text>
  <!-- brand -->
  <text x="90" y="600" font-family="'Space Grotesk', Inter, sans-serif" font-size="28" font-weight="700" fill="#a855f7">HackHouse</text>
  <text x="265" y="600" font-family="Inter, system-ui, sans-serif" font-size="22" fill="#94a3b8">Gurgaon, India</text>
</svg>
