<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    
    <!-- Primary SEO -->
    <title>HackHouse Gurgaon - Co-Living Space for Founders & Builders</title>
    <meta name="description" content="HackHouse Gurgaon: A curated co-living space for founders, developers, and builders. Get ₹60,000+ worth of resources for just ₹30,000/month. Fully-furnished stay, 3 meals, AI tools, and 1 Gbps internet." />
    <meta name="keywords" content="hacker house, co-living space, Gurgaon, founders, developers, startup accelerator, India, hackhouse, coworking, living space" />
    <meta name="author" content="HackHouse" />
    <meta name="robots" content="index, follow" />
    <link rel="canonical" href="https://hackhouse.in/" />

    <!-- Open Graph / Facebook -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://hackhouse.in/" />
    <meta property="og:title" content="HackHouse Gurgaon - Build Faster. Together." />
    <meta property="og:description" content="Join a tribe of 8 curated builders. Fully-furnished stay, 3 meals daily, premium AI tools, and high-collaboration living." />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:site_name" content="HackHouse Gurgaon" />
    <meta property="og:locale" content="en_IN" />

    <!-- Twitter -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:url" content="https://hackhouse.in/" />
    <meta name="twitter:title" content="HackHouse Gurgaon - Build Faster. Together." />
    <meta name="twitter:description" content="Join a tribe of 8 curated builders. Fully-furnished stay, 3 meals daily, premium AI tools, and high-collaboration living." />
    <meta name="twitter:site" content="@HackHouseGGN" />

    <!-- Mobile / PWA -->
    <meta name="theme-color" content="#0f172a" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="HackHouse" />
    <meta name="mobile-web-app-capable" content="yes" />

    <!-- Location -->
    <meta name="geo.region" content="IN-HR" />
    <meta name="geo.placename" content="Gurgaon" />

    <!-- Favicon -->
    <link rel="icon" type="image/x-icon" href="/favicon.ico" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.json" />

    <!-- Preconnect -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">

    <!-- Structured Data - Organization -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "Organization",
      "name": "HackHouse Gurgaon",
      "url": "https://hackhouse.in",
      "logo": "https://hackhouse.in/favicon.ico",
      "description": "A curated co-living space for founders, developers, and builders in Gurgaon, India",
      "sameAs": [
        "https://twitter.com/HackHouseGGN"
      ],
      "contactPoint": {
        "@type": "ContactPoint",
        "contactType": "customer service",
        "url": "https://hackhouse.in"
      }
    }
    </script>

    <!-- Structured Data - LocalBusiness -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "LocalBusiness",
      "name": "HackHouse Gurgaon",
      "description": "Curated co-living space for founders, developers, and builders",
      "address": {
        "@type": "PostalAddress",
        "addressLocality": "Gurgaon",
        "addressRegion": "Haryana",
        "addressCountry": "IN"
      },
      "priceRange": "₹30,000",
      "offers": {
        "@type": "Offer",
        "name": "Co-living Membership",
        "price": "30000",
        "priceCurrency": "INR",
        "description": "Fully-furnished stay, 3 meals daily, 1 Gbps internet, premium AI tools, and curated community"
      },
      "openingHours": "Mo-Su 00:00-23:59"
    }
    </script>
  </head>

  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
